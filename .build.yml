image: debian/stable
packages:
  - build-essential
  - cmake
  - git
  - gcc-arm-none-eabi
  - libnewlib-arm-none-eabi
sources:
  - https://git.sr.ht/~itsams_wav/weather_station
tasks:
  - build-firmware: |
      cd "$HOME/weather_station"
      cmake --preset Debug
      cmake --build --preset Debug --parallel
      tar -czf firmware-artifacts.tar.gz build/Debug
artifacts:
  - weather_station/firmware-artifacts.tar.gz
